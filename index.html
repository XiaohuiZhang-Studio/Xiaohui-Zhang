<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Xiaohui Zhang</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:black;
      color:white;
      font-family:Arial, sans-serif;
      overflow-x:hidden;
    }

    section{
      width:100%;
      padding:120px 10%;
    }

    /* HERO */

    .hero{
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }

    .hero h1{
      font-size:80px;
      font-weight:300;
      letter-spacing:2px;
      margin-bottom:20px;
    }

    .hero p{
      font-size:20px;
      opacity:0.7;
    }

    /* WHO I AM */

    .about{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:80px;
    }

    .about-text{
      flex:1;
    }

    .about-text h2{
      font-size:18px;
      margin-bottom:40px;
      opacity:0.5;
      letter-spacing:3px;
      text-transform:uppercase;
    }

    .about-text p{
      font-size:34px;
      line-height:1.6;
      font-weight:300;
    }

    .about-image{
      flex:1;
    }

    .about-image img{
      width:100%;
      height:700px;
      object-fit:cover;
      filter:grayscale(100%);
    }

    /* MOBILE */

    @media(max-width:900px){

      .hero h1{
        font-size:48px;
      }

      .about{
        flex-direction:column;
      }

      .about-text p{
        font-size:24px;
      }

      .about-image img{
        height:500px;
      }

    }

  </style>
</head>

<body>

  <!-- HERO -->

  <section class="hero">

    <h1>Xiaohui Zhang</h1>

    <p>
      Urban Research / Mapping / Informality
    </p>

  </section>

  <!-- WHO I AM -->

  <section class="about">

    <div class="about-text">

      <h2>Who I Am</h2>

      <p>

        I work between urban research,
        mapping, and spatial storytelling.

        My work focuses on informal public
        performance spaces, migration,
        and everyday negotiations in Chinese cities.

      </p>

    </div>

    <div class="about-image">

      <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?q=80&w=1200&auto=format&fit=crop">

    </div>

  </section>

</body>

</html>
